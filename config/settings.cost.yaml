# DSH 成本治理配置片段
#
# 用法：把下面各段合并进 ~/.dsh/settings.yaml（用户设置层，即时生效，无需重启）。
# 顶层 key 就是插件名；未列出的字段沿用插件默认值。
#
# 依据：字段名与约束均从插件源码读出
#   dsh-spill-policy/lib/index.js        Config = z.object({ maxInlineBytes: z.number() })
#   dsh-compaction-basic/lib/index.js    thresholdRatioSchema = z.number()
#                                        DEFAULT_THRESHOLD_RATIO = .8
#                                        DEFAULT_RETAIN_RATIO = .16
#                                        校验：retainRatio < thresholdRatio，否则 throw
#                                        auto 默认 true
#   dsh-llm-deepseek/lib/index.js        reasoningEffort 只接受 "off" | "high" | "max"
# ---------------------------------------------------------------------------

# ① 超大工具输出落盘
#    未配置 maxInlineBytes 时该插件【不注册任何东西】= true no-op，
#    所有网页抓取 / bash 输出都整段永久驻留上下文，并被之后每一轮重复计费。
#    行为：超出后全文存到会话级 spill 产物，模型只看到"头尾预览 + 落盘路径 + 取回提示"。
#    例外：read 工具被刻意排除（防 read → spill → read again 死循环）。
#    ⚠️ 2026-09-19 更正：本插件【只作用于工具结果】。子代理报告以 user/message
#       （source: subagent-report）进来，【永不落盘】——实测一份 47,405 字符的报告
#       整段驻留主上下文。对策在行为侧：presets/standard-leash 的 persona +
#       handoff/README.md §5（报告写 .handoff/reports/，只回 ≤10 行）。
spill-policy:
  maxInlineBytes: 8192

# ② 压缩阈值：0.8 -> 0.35
#    触发点 thresholdTokens = floor(contextWindow × thresholdRatio)。
#    deepseek-v4-flash 的 contextWindow = 1024000：
#      0.8  → 819200 token 才压缩（太晚）
#      0.35 → 358400 token（仍远高于日常需要）
#    retainRatio 保持默认 0.16 < 0.35，满足校验。
#    注：压缩是【原地重写历史】，会作废被改写位置之后的前缀缓存
#        （Copilot 生产数据：命中率中位 −66%），所以它省钱但不如"交接"划算。
compaction-basic:
  thresholdRatio: 0.35

# ③ 推理档位 —— ⚠️ 2026-09-19 更正：不要写 medium
#    DeepSeek 适配器只接受 off / high / max（medium 会抛 UNSUPPORTED_REASONING_EFFORT）。
#    而且 high 本来就是默认档，下面这行写与不写等价。
#    正确用法（详见 handoff/README.md §6 与 docs/交接体系.md §6）：
#      · 执行型会话：off（关思考，实测同一道多步题只需 1 个输出 token）
#      · 决策/反思型会话：high
#      · 难题：max（必须显式压 max_tokens，该档默认抬到 128K）
#      · 换档只在会话边界做（每个档位是独立缓存谱系；长上下文里首次启用 = 一次全冷 ¥0.5 + 20s）
agent-default-model:
  reasoningEffort: high          # 默认档；写它=no-op，保留只为显式

# ---------------------------------------------------------------------------
# 相关但无需改动的插件（本来就在跑）：
#   token-meter                  计量
#   tool-result-pruner           阈值 8192 字符，但【只在压缩阶段生效】
#   spill-local / spill / 存储后端
#   command-compact              提供 /compact 手动压缩命令
#
# 另见：settings.deepseek-cheap.yaml（子代理专用"关思考"路由）
#      settings.preset.yaml（禁递归 + 子代理降档的 preset 开关）
# ---------------------------------------------------------------------------
