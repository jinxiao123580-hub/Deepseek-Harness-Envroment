ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    google:
      apiKeyEnv: GEMINI_API_KEY
    volcengine-coding-plan:
      displayName: 火山 Coding Plan
      apiKeyEnv: VOLCENGINE_CODING_PLAN_API_KEY
      api: openai-completions
      baseURL: https://ark.cn-beijing.volces.com/api/coding/v3
      models:
        - id: ark-code-latest
          name: 火山 Coding Plan（控制台所选模型）
    volcengine-agent-plan:
      displayName: 火山 Agent Plan
      apiKeyEnv: VOLCENGINE_AGENT_PLAN_API_KEY
      api: openai-responses
      baseURL: https://ark.cn-beijing.volces.com/api/plan/v3
      models:
        - id: deepseek-v4-flash
        - id: deepseek-v4-pro
    aliyun-bailian:
      displayName: 阿里云百炼
      apiKeyEnv: DASHSCOPE_API_KEY
      api: openai-completions
      baseURL: https://dashscope.aliyuncs.com/compatible-mode/v1
      models:
        - id: deepseek-v4-flash
        - id: deepseek-v4-pro
    siliconflow:
      displayName: 硅基流动
      apiKeyEnv: SILICONFLOW_API_KEY
      api: openai-completions
      baseURL: https://api.siliconflow.cn/v1
      models:
        - id: deepseek-ai/DeepSeek-V4-Flash
    deepseek-qq:
      displayName: DeepSeek QQ 独立
      apiKeyEnv: DEEPSEEK_QQ_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      compat:
        thinkingFormat: deepseek
        supportsDeveloperRole: false
        maxTokensField: max_tokens
      models:
        - id: deepseek-v4-flash-vision-exp
          name: DeepSeek V4 Flash Vision（QQ 专用）
          input:
            - text
            - image
          reasoningEfforts:
            high: high
            max: max
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash（QQ 专用）
          input:
            - text
          reasoningEfforts:
            high: high
            max: max
        - id: deepseek-v4-pro
          name: DeepSeek V4 Pro（QQ 专用）
          input:
            - text
          reasoningEfforts:
            high: high
            max: max
# 默认模型。
#
# provider 用 `deepseek-official` —— 它是 dsh-llm-deepseek 注册的**原生路由**
# （lib/index.js:1840 `const PROVIDER = "deepseek-official";`），
# 四个模型统一拿到 off / low / high / max（lib/index.js:1417 REASONING_EFFORTS）。
# **包含 off** —— 规则 4 的"执行型会话用 off"靠它才成立。
#
# 注意别和目录里的 provider `deepseek`（pi-ai 路由）混：那个的
# deepseek-v4-flash 只有 low/high/max，deepseek-v4-pro 只有 high/max，都没有 off。
#
# model 可选（都在 deepseek-official 下）：
#   deepseek-flash                 DeepSeek-V41-Flash，text+image，日常默认
#   deepseek-v4-flash              纯文本
#   deepseek-v4-pro                复杂任务，更贵
#   deepseek-v4-flash-vision-exp   与 deepseek-flash 实际路由到的后端同名，显式写法
#
# 核查当前生效值：node tools/show-effort-levels.mjs --current
agent-default-model:
  provider: deepseek-official
  model: deepseek-flash
  reasoningEffort: high
agent-presets:
  default: router-standard
ui-theme:
  preference: system
