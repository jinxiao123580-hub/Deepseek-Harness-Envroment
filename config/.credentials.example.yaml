# ---------------------------------------------------------------------------
# .credentials.example.yaml  —  TEMPLATE ONLY (placeholders, no real keys)
# ---------------------------------------------------------------------------
# This file is a SAFE template for DeepSeek Harness provider credentials.
# It has NO real secrets. Copy it to %USERPROFILE%\.dsh\.credentials.yaml,
# then fill in your real keys. NEVER commit that real file (it is gitignored).
#
# Tip: on the new machine you can just run  .\config\set-credentials.ps1
#      which prompts for each key and writes the real file for you.
#      Or, to move existing keys, privately copy your old .credentials.yaml
#      (do NOT place it in this repo / do NOT push it).
#
# The env-var NAMES here are what settings.yaml references via `apiKeyEnv`.
# ---------------------------------------------------------------------------
version: 1
refs:
  DEEPSEEK_API_KEY: sk-REPLACE_WITH_YOUR_DEEPSEEK_KEY
  DEEPSEEK_QQ_API_KEY: sk-REPLACE_WITH_YOUR_DEEPSEEK_QQ_KEY
  GEMINI_API_KEY: AQ.A-REPLACE_WITH_YOUR_GOOGLE_KEY
  VOLCENGINE_CODING_PLAN_API_KEY: ark-REPLACE_WITH_YOUR_VOLCENGINE_CODING_KEY
  VOLCENGINE_AGENT_PLAN_API_KEY: ark-REPLACE_WITH_YOUR_VOLCENGINE_AGENT_KEY
  DASHSCOPE_API_KEY: sk-REPLACE_WITH_YOUR_ALIYUN_DASHSCOPE_KEY
  SILICONFLOW_API_KEY: sk-REPLACE_WITH_YOUR_SILICONFLOW_KEY
