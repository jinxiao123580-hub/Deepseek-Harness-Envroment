# rtk (Rust Token Killer) config template
# 位置（Windows）: %APPDATA%\rtk\config.toml
# 本文件是「默认配置」参考。新电脑安装后运行:
#      rtk config --create
# 会在 %APPDATA%\rtk\config.toml 生成一份可编辑的默认配置（内容与本文件一致）。
# 之后可按需修改。

[tracking]
enabled = true
history_days = 90

[display]
colors = true
emoji = true
max_width = 120

[filters]
ignore_dirs = [
    ".git",
    "node_modules",
    "target",
    "__pycache__",
    ".venv",
    "vendor",
]
ignore_files = [
    "*.lock",
    "*.min.js",
    "*.min.css",
]

[tee]
enabled = true
mode = "failures"
max_files = 20
max_file_size = 1048576

[telemetry]
enabled = false

[hooks]
exclude_commands = []
transparent_prefixes = []

[limits]
grep_max_results = 200
grep_max_per_file = 25
status_max_files = 15
status_max_untracked = 10
passthrough_max_chars = 2000
